<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luminous 白猫动作预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f3f4f6; color: #1a1a1a; font-family: "Microsoft YaHei", sans-serif; }
    main { max-width: 1200px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 24px; color: #526071; font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 18px; background: white; border: 2px solid #1a1a1a; border-radius: 6px; }
    img { display: block; width: 100%; height: 180px; object-fit: contain; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    figcaption p { margin: 0; color: #526071; font-size: 13px; line-height: 1.65; }
    @media (max-width: 700px) { body { padding: 20px; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } img { height: 140px; } }
  </style>
</head>
<body>
<main>
  <h1>Luminous · 七个小动作</h1>
  <p class="intro">待确认的插画与拟放位置 · 正式页面尚未嵌入</p>
  <div class="gallery">
    <figure><img src="luminous-cat-explore-20261011.png" alt="白猫抬爪张望"><figcaption><h2>发现社区 · 张望</h2><p>页头右侧，靠近标题区域。<br>与创建按钮保留间距。</p></figcaption></figure>
    <figure><img src="luminous-cat-community-20261011.png" alt="白猫托腮听大家聊天"><figcaption><h2>社区详情 · 托腮</h2><p>右侧「社区约定」卡片内。<br>手机端随卡片排到讨论区下方。</p></figcaption></figure>
    <figure><img src="luminous-cat-reading-20261011.png" alt="白猫捧着一本小书"><figcaption><h2>帖子详情 · 看书</h2><p>正文末尾右下方。<br>放在点赞、收藏按钮之前。</p></figcaption></figure>
    <figure><img src="luminous-cat-collection-20261011.png" alt="白猫抱着黄蓝星星"><figcaption><h2>我的收藏 · 抱星星</h2><p>「我的收藏」页头右侧。<br>不占用帖子列表的位置。</p></figcaption></figure>
    <figure><img src="luminous-cat-profile-20261011.png" alt="白猫抬爪整理耳朵"><figcaption><h2>个人主页 · 整理耳朵</h2><p>个人资料卡底部右侧。<br>和发帖、关注统计并排。</p></figcaption></figure>
    <figure><img src="luminous-cat-admin-20261011.png" alt="白猫拿着记录板"><figcaption><h2>管理后台 · 拿记录板</h2><p>管理后台页头右侧。<br>小尺寸，不进入用户表格。</p></figcaption></figure>
    <figure><img src="luminous-cat-lost-20261011.png" alt="白猫歪头挠脑袋"><figcaption><h2>404 页面 · 歪头</h2><p>404 提示上方居中。<br>可以比其他页面稍大一些。</p></figcaption></figure>
  </div>
</main>
</body>
</html>
