<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luminous 猫猫正式原型与七个动作</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f3f4f6; color: #1a1a1a; font-family: "Microsoft YaHei", sans-serif; }
    main { max-width: 1200px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 24px; color: #526071; font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 18px; background: white; border: 2px solid #1a1a1a; border-radius: 6px; }
    .master { border-color: #2563eb; }
    img { display: block; width: 100%; height: 200px; object-fit: contain; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    figcaption p { margin: 0; color: #526071; font-size: 13px; line-height: 1.65; }
    @media (max-width: 700px) { body { padding: 20px; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } img { height: 160px; } }
  </style>
</head>
<body>
<main>
  <h1>Luminous · 正式原型与七个小动作</h1>
  <p class="intro">按正式原型重新制作 · 小手、小脚、窄身体 · 待图片确认后再嵌入页面</p>
  <div class="gallery">
    <figure class="master"><img src="../luminous-cat-master.png" alt="用户已确认的猫猫正式原型"><figcaption><h2>正式原型 · 对照</h2><p>已确认的角色外形。<br>头部与身体比例以此为准。</p></figcaption></figure>
    <figure><img src="luminous-cat-explore-v2.png" alt="白猫抬起小爪张望"><figcaption><h2>发现社区 · 张望</h2><p>页头右侧。<br>与创建按钮留开距离。</p></figcaption></figure>
    <figure><img src="luminous-cat-community-v2.png" alt="白猫用小爪托腮"><figcaption><h2>社区详情 · 托腮</h2><p>右侧「社区约定」卡片内。<br>手机端随卡片排到讨论下方。</p></figcaption></figure>
    <figure><img src="luminous-cat-reading-v2.png" alt="白猫用小爪捧着书"><figcaption><h2>帖子详情 · 看书</h2><p>正文末尾右侧。<br>互动按钮之前。</p></figcaption></figure>
    <figure><img src="luminous-cat-collection-v2.png" alt="白猫抱着黄蓝渐变星星"><figcaption><h2>我的收藏 · 抱星星</h2><p>页头右侧。<br>不占用帖子列表的位置。</p></figcaption></figure>
    <figure><img src="luminous-cat-profile-v2.png" alt="白猫用小爪整理耳朵"><figcaption><h2>个人主页 · 整理耳朵</h2><p>资料卡底部右侧。<br>统计旁边。</p></figcaption></figure>
    <figure><img src="luminous-cat-admin-v2.png" alt="白猫用小爪拿着记录板"><figcaption><h2>管理后台 · 拿记录板</h2><p>页头右侧。<br>小尺寸，不进入用户表格。</p></figcaption></figure>
    <figure><img src="luminous-cat-lost-v2.png" alt="白猫歪头"><figcaption><h2>404 页面 · 歪头</h2><p>错误提示上方居中。<br>尺寸稍大一些。</p></figcaption></figure>
  </div>
</main>
</body>
</html>
