# 安装到 /etc/nginx/sites-available/luminous，兼容 Ubuntu Nginx 1.18。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name myluminous.xyz www.myluminous.xyz 8.137.79.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/luminous-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://myluminous.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myluminous.xyz;

    # 正式开放前，证书必须同时覆盖主域名与 www 域名。
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://myluminous.xyz$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name myluminous.xyz;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/luminous;
    index index.html;
    client_max_body_size 12m;

    # 不记录查询参数，避免文件能力令牌进入访问日志。
    access_log /var/log/nginx/luminous.access.log luminous_cloud;
    error_log /var/log/nginx/luminous.error.log warn;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # 当前 Nginx 直接面向公网，覆盖客户端伪造的转发链。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
