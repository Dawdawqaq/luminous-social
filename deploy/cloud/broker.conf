# 小内存单机配置，只允许同一 Docker 网络中的后端访问。
brokerClusterName = LuminousCloudCluster
brokerName = luminous-cloud-broker
brokerId = 0
brokerIP1 = 172.29.79.20
namesrvAddr = namesrv:9876
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
deleteWhen = 04
fileReservedTime = 24
diskMaxUsedSpaceRatio = 85

# 缩小单个日志文件和队列文件；此配置仅用于新建云环境。
mappedFileSizeCommitLog = 67108864
mappedFileSizeConsumeQueue = 300000
transientStorePoolEnable = false
defaultTopicQueueNums = 2
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
sendMessageThreadPoolNums = 2
pullMessageThreadPoolNums = 4
queryMessageThreadPoolNums = 2
adminBrokerThreadPoolNums = 2
clientManageThreadPoolNums = 2
consumerManageThreadPoolNums = 2
