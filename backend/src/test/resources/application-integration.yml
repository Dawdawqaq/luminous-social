spring:
  application:
    name: luminous-api-test
  datasource:
    url: jdbc:mysql://localhost:3306/luminous?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: local-root-change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: change-this-development-secret-change-this-development-secret
    expiration-minutes: 1440
  upload:
    dir: ./uploads-test
  storage:
    type: local
  public-base-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  rocketmq:
    enabled: true
    name-server: localhost:9876
    producer-group: luminous-producer-test
    consumer-group: luminous-consumer-test
    notification-topic: luminous-notifications-test
    vote-topic: luminous-votes-test
    vote-consumer-group: luminous-vote-consumer-test
