server:
  # 代理头由显式可信代理解析器处理，避免框架提前信任客户端输入。
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: luminous-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:luminous}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:local-root-change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  lumi:
    enabled: ${LUMI_ENABLED:false}
    api-key: ${LUMI_API_KEY:}
    model: ${LUMI_MODEL:deepseek-flash}
    daily-budget-micros: ${LUMI_DAILY_BUDGET_MICROS:100000}
    daily-calls: ${LUMI_DAILY_CALLS:100}
    concurrency: ${LUMI_CONCURRENCY:2}
    queue-capacity: ${LUMI_QUEUE_CAPACITY:20}
    cooldown-seconds: ${LUMI_COOLDOWN_SECONDS:60}
    user-daily: ${LUMI_USER_DAILY:10}
    user-post-daily: ${LUMI_USER_POST_DAILY:2}
    post-daily: ${LUMI_POST_DAILY:10}
    max-input-bytes: ${LUMI_MAX_INPUT_BYTES:16000}
    max-output-tokens: ${LUMI_MAX_OUTPUT_TOKENS:384}
    timeout-seconds: ${LUMI_TIMEOUT_SECONDS:25}
    max-attempts: ${LUMI_MAX_ATTEMPTS:2}
    input-micros-per-million: ${LUMI_INPUT_MICROS_PER_MILLION:300000}
    output-micros-per-million: ${LUMI_OUTPUT_MICROS_PER_MILLION:1200000}
  lumi-chat:
    user-daily: ${LUMI_CHAT_USER_DAILY:20}
    cooldown-seconds: ${LUMI_CHAT_COOLDOWN_SECONDS:5}
    output-tokens: ${LUMI_CHAT_OUTPUT_TOKENS:768}
    context-turns: ${LUMI_CHAT_CONTEXT_TURNS:6}
    max-conversations: ${LUMI_CHAT_MAX_CONVERSATIONS:50}
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
    secure-cookies: ${SECURE_COOKIES:false}
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:管理员}
  idempotency:
    retention-seconds: ${IDEMPOTENCY_RETENTION_SECONDS:86400}
  checkin:
    # 首次升级可显式导入仍存活的旧签到位图，成功后关闭开关。
    import-legacy-history: ${CHECKIN_IMPORT_LEGACY_HISTORY:false}
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  storage:
    type: ${STORAGE_TYPE:local} # local | minio
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${APP_PUBLIC_BASE_URL:http://localhost:8080}}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin-local}
      bucket: ${MINIO_BUCKET:luminous-uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:luminous-producer-group}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:luminous-consumer-group}
    notification-topic: ${ROCKETMQ_NOTIFICATION_TOPIC:luminous-notifications}
    vote-topic: ${ROCKETMQ_VOTE_TOPIC:luminous-votes-topic}
    vote-consumer-group: ${ROCKETMQ_VOTE_CONSUMER_GROUP:luminous-vote-consumer-group}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
