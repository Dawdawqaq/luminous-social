server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: luminous-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:luminous}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:local-root-change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  storage:
    type: ${STORAGE_TYPE:local} # local | minio
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin-local}
      bucket: ${MINIO_BUCKET:luminous-uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:luminous-producer-group}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:luminous-consumer-group}
    notification-topic: ${ROCKETMQ_NOTIFICATION_TOPIC:luminous-notifications}
    vote-topic: ${ROCKETMQ_VOTE_TOPIC:luminous-votes-topic}
    vote-consumer-group: ${ROCKETMQ_VOTE_CONSUMER_GROUP:luminous-vote-consumer-group}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
