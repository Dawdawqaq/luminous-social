# ==============================================================================
# Luminous 独立开发测试环境基础编排
# ==============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-luminous}
      MYSQL_USER: ${DB_USER:-luminous}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luminous_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-luminous_root_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-33067}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-63797}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-luminous_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-luminous_secret_password}
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-net

  namesrv:
    image: apache/rocketmq:5.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "${NAMESRV_PORT:-19876}:9876"
    networks:
      - app-net

  broker:
    image: apache/rocketmq:5.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    environment:
      NAMESRV_ADDR: namesrv:9876
    ports:
      - "20909:10909"
      - "${BROKER_PORT:-20911}:10911"
      - "20912:10912"
    depends_on:
      - namesrv
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    networks:
      - app-net

  backend:
    image: luminous-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-luminous}
      DB_USER: ${DB_USER:-luminous}
      DB_PASSWORD: ${DB_PASSWORD:-luminous_password}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-true}
      ROCKETMQ_NAMESRV: namesrv:9876
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-luminous_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-luminous_secret_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-luminous-uploads}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-${APP_PUBLIC_BASE_URL:-http://localhost:18080}}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-change-this-development-secret}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-管理员}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:18080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000,http://localhost:18080,http://127.0.0.1:13000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-net

  frontend:
    image: luminous-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    networks:
      - app-net

networks:
  app-net:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-net
    driver: bridge

volumes:
  mysql_data:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-mysql-data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-redis-data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-minio-data
  namesrv_data:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-namesrv-data
  broker_data:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-broker-data
  broker_store:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-broker-store
  uploads_data:
    name: ${COMPOSE_PROJECT_NAME:-luminous-dev}-uploads-data
