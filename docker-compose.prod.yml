# 双节点生产模拟配置；仅渲染核对，不由修复脚本启动或修改生产数据。
# ports 使用 !override 真正替换基础文件的端口列表，要求 Compose 2.24.4 及以上。
x-backend-environment: &backend-environment
  SERVER_PORT: 8080
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-luminous_prod}
  DB_USER: ${DB_USER:-luminous_prod_user}
  DB_PASSWORD: ${DB_PASSWORD:?请配置数据库密码}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
  JWT_SECRET: ${JWT_SECRET:?请配置统一 JWT 密钥}
  JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
  ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-true}
  ROCKETMQ_NAMESRV: namesrv:9876
  STORAGE_TYPE: ${STORAGE_TYPE:-minio}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?请配置对象存储用户}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请配置对象存储密码}
  MINIO_BUCKET: ${MINIO_BUCKET:-luminous-prod-uploads}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-${APP_PUBLIC_BASE_URL:?请配置浏览器可访问的公开地址}}
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?请配置浏览器可访问的公开地址}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请配置允许的前端来源}
  TRUSTED_PROXIES: ${PROXY_IP:-172.30.50.10}/32
  SECURE_COOKIES: ${SECURE_COOKIES:-false}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-管理员}
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xms384m -Xmx384m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"

services:
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-nginx-lb
    restart: unless-stopped
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend-2
      - frontend
    networks:
      proxy-net:
        ipv4_address: ${PROXY_IP:-172.30.50.10}

  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-backend-1
    ports: !override []
    environment: !override
      <<: *backend-environment
      SNOWFLAKE_WORKER_ID: "1"
      SNOWFLAKE_DATACENTER_ID: "1"
    networks: !override
      app-net: {}
      proxy-net: {}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  backend-2:
    image: luminous-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-backend-2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-environment
      SNOWFLAKE_WORKER_ID: "2"
      SNOWFLAKE_DATACENTER_ID: "1"
    volumes:
      - uploads_data:/app/uploads
    networks:
      app-net: {}
      proxy-net: {}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  frontend:
    ports: !override []
    networks: !override
      proxy-net: {}

  mysql:
    ports: !override
      - "127.0.0.1:${MYSQL_PORT:-33066}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-luminous_prod}
      MYSQL_USER: ${DB_USER:-luminous_prod_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置数据库密码}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请配置数据库管理密码}

  redis:
    ports: !override
      - "127.0.0.1:${REDIS_PORT:-63790}:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请配置 Redis 密码}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]

  minio:
    ports: !override
      - "127.0.0.1:${MINIO_PORT:-29000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-29001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请配置对象存储用户}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请配置对象存储密码}

  namesrv:
    ports: !override []
  broker:
    ports: !override []
    volumes: !override
      - ./broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf

networks:
  proxy-net:
    name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-proxy-net
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.50.0/24}
