# ==============================================================================
# Luminous - Production Simulation Lab (Overlay & Cluster Extension)
# ==============================================================================
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
# ==============================================================================
services:
  # 生产反向代理与高可用负载均衡器 (接管宿主机 80/443)
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-nginx-lb
    restart: unless-stopped
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
      - "${PROD_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend-2
      - frontend
    networks:
      - app-net

  # 覆盖基础 backend 为生产后端集群节点 1 (不直接暴露端口，由 Nginx 负载均衡)
  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-backend-1
    ports: []
    environment:
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx384m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  # 生产后端集群节点 2 (验证分布式集群负载均衡与会话一致性)
  backend-2:
    image: luminous-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-luminous-prod}-backend-2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-luminous_prod}
      DB_USER: ${DB_USER:-luminous_prod_user}
      DB_PASSWORD: ${DB_PASSWORD:-ProdSecurePass2026!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAMESRV: namesrv:9876
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-prod_luminous_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ProdMinioSecretPass2026!}
      MINIO_BUCKET: ${MINIO_BUCKET:-luminous-prod-uploads}
      APP_PUBLIC_BASE_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx384m -XX:+UseG1GC"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  # 覆盖基础 frontend (不直接暴露端口，由 Nginx 统一代理)
  frontend:
    ports: []
